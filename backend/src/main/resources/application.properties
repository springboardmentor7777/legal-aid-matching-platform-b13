
spring.datasource.url=jdbc:postgresql://localhost:5432/legalmatchpro
spring.datasource.username=postgres
spring.datasource.password=Adhi@2004
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

server.port=8080

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=LegalMatch Pro
info.app.version=1.0.0
info.app.description=Legal Aid Matching Platform
