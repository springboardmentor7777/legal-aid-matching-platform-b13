
spring.datasource.url=jdbc:postgresql://localhost:5432/legal_system
spring.datasource.username=legal_user
spring.datasource.password=legal@321
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
